services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: setu
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - setu-postgres:/var/lib/postgresql/data
      - ./services/prism-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu"]
      interval: 5s
      timeout: 5s
      retries: 20

  prism-ocr:
    build:
      context: ./services/prism-ocr-worker
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20

  prism-api:
    build:
      context: .
      dockerfile: services/prism-api/Dockerfile
    environment:
      PORT: 8000
      DATABASE_URL: postgres://setu:setu_dev_password@postgres:5432/setu
      OCR_WORKER_URL: http://prism-ocr:8100
      RESOURCE_STORAGE_PATH: /app/data/resources
      NODE_ENV: development
      BHASHINI_ASR_URL: ${BHASHINI_ASR_URL:-}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      prism-ocr:
        condition: service_healthy
    volumes:
      - prism-resources:/app/data/resources

volumes:
  setu-postgres:
  prism-resources:
