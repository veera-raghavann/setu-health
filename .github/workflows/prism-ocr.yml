name: PRISM OCR

on:
  pull_request:
    paths:
      - "services/prism/ocr/**"
      - ".github/workflows/prism-ocr.yml"
  push:
    branches: [main]
    paths:
      - "services/prism/ocr/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prism/ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
