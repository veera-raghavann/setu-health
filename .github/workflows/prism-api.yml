name: PRISM API

on:
  pull_request:
    paths:
      - "services/prism-api/**"
      - ".github/workflows/prism-api.yml"
  push:
    branches: [main, PRISM-001]
    paths:
      - "services/prism-api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/prism-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test